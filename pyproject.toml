[project]
name = "stockman-backend"
version = "0.1.0"
description = "Audited spot paper-trading API"
requires-python = ">=3.11"
dependencies = [
  "django>=5.2,<5.3",
  "djangorestframework>=3.16,<3.17",
  "django-environ>=0.12,<0.14",
  "drf-spectacular>=0.28,<0.30",
  "httpx>=0.28,<0.29",
  "uvicorn>=0.34,<0.42",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<10",
  "pytest-django>=4.10,<5",
  "pytest-cov>=6,<8",
  "pytest-mock>=3.14,<4",
  "hypothesis>=6.130,<7",
  "ruff>=0.11,<1",
  "mypy>=1.15,<2",
  "django-stubs>=5.2,<5.3",
  "djangorestframework-stubs>=3.16,<3.17",
  "babel>=2.17,<3",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = ["live: explicitly enabled external market-data checks"]

[tool.coverage.run]
source = ["apps"]
omit = ["*/migrations/*", "*/__init__.py"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
ignore_missing_imports = true
check_untyped_defs = true
exclude = ["migrations/", "tests/"]

[tool.django-stubs]
django_settings_module = "config.settings"
